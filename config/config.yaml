# ============================================================
# 简历 RAG 智能问答系统 - 唯一配置文件
# 修改后重新启动服务即可生效
# 环境变量可覆盖（ES_HOST / APP_PORT / APP_MODE / LOG_LEVEL）
# ============================================================

app:
  name: "resume-rag-service"
  host: "0.0.0.0"
  port: 8080
  mode: "release"       # dev 模式自动开启热重载 + CORS *

log:
  level: "info"
  path: "./log"
  filename: "app.log"
  maxSize: 100
  maxBackups: 30
  maxAge: 7
  compress: true

elasticsearch:
  hosts:
    - "http://maco.hackercd.cn:9200"   # Docker 内用 http://elasticsearch:9200
  index: "pdf_knowledge_base"
  vector_dim: 512              # BGE-small-zh-v1.5 实际输出 512 维
  request_timeout: 30

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"
  cache_folder: "./models"
  max_concurrent: 4
  batch_size: 32

chunk:
  chunk_size: 400
  overlap: 50

llm:
  default_provider: "openai"
  default_model: "gpt-4o-mini"
  timeout: 60
  temperature: 0.3
  max_tokens: 1000

rerank:
  enabled: false
  model_name: "cross-encoder/ms-marco-MiniLM-L-6V2"

retrieval:
  top_k: 5
  min_score: 0.5

cors:
  allowed_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "http://192.168.3.188:8080"
