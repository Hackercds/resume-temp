# ============================================================
# 简历 RAG 智能问答系统 - 唯一配置文件
# 修改后重新启动服务即可生效
# 环境变量可覆盖（ES_HOST / APP_PORT / APP_MODE / LOG_LEVEL / DEFAULT_API_KEY）
# ============================================================

app:
  name: "resume-rag-service"
  host: "0.0.0.0"
  port: 8080
  mode: "release"       # dev 模式自动开启热重载 + CORS *
  default_api_key: ""   # 团队部署时注入，用户前端无需填写

log:
  level: "debug"
  path: "./log"
  filename: "app.log"
  maxSize: 100
  maxBackups: 30
  maxAge: 7
  compress: true

elasticsearch:
  hosts:
    - "http://maco.hackercd.cn:9200"   # 默认本地,但是我要用先在我自己的环境部署一下，你们用的时候自己改自己的环境。Docker 内用 http://elasticsearch:9200（ES_HOST 环境变量覆盖）
  index: "pdf_knowledge_base"
  vector_dim: 512              # BGE-small-zh-v1.5 实际输出 512 维
  request_timeout: 30

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"
  cache_folder: "./models"
  max_concurrent: 4
  batch_size: 32

chunk:
  chunk_size: 400
  overlap: 50
  strategy: "hybrid"        # fixed(滑动窗口) | semantic(标题语义) | hybrid(标题+滑动窗口)
  csv_inject_header: true   # CSV 每行分块时注入表头，保持每行语义完整

llm:
  default_provider: "openai"
  default_model: "gpt-4o-mini"
  timeout: 60
  temperature: 0.3
  max_tokens: 1000
  presets:
    - name: "OpenAI GPT-4o-mini"
      provider: "openai"
      model: "gpt-4o-mini"
      base_url: ""
    - name: "硅基流动 DeepSeek-V3"
      provider: "openai"
      model: "deepseek-chat"
      base_url: "https://api.siliconflow.cn/v1"
    - name: "MiniMax"
      provider: "openai"
      model: "abab6.5s-chat"
      base_url: "https://api.minimax.chat/v1"

rerank:
  enabled: false
  model_name: "cross-encoder/ms-marco-MiniLM-L-6V2"

retrieval:
  top_k: 5
  min_score: 0.0            # RRF 融合后分数 ≤ 0.033，阈值默认 0，由 RRF 排名决定
  enable_full_document: true
  enable_neighbor_expansion: true   # 命中 chunk 后召回同文档相邻块拼接上下文
  neighbor_window: 1                  # 前后各扩展 N 个 chunk
  enable_doc_diversity: true          # 文档多样性：top_k 覆盖多文档，避免单文档垄断
  max_chunks_per_doc: 2               # 单文档在 primary 命中里的最大 chunk 数
  context_char_budget: 6000           # 上下文字符预算，保护模型窗口，按文档分配

conversation:
  max_history: 5
  context_window: 8000
  enable_full_document: true
  enable_query_rewrite: true
  source_boost: 0.15
  source_boost_decay: 5
  summary_threshold: 3
  enable_intent_llm: false
  intent_rule_confidence_threshold: 0.85
  intent_model: "gpt-4o-mini"
  follow_up_vector_use_expanded: true   # 追问向量用纯实体消解版，避免对话噪音污染语义空间
  enable_query_vector_cache: true       # 相同问题复用向量，避免重复推理
  query_vector_cache_size: 128

cors:
  allowed_origins:
    # release 模式下 CORS 严格匹配。dev 模式自动 * 不限制
    - "http://localhost:8080"     # 后端自带前端面板
    - "http://localhost:5000"     # 独立前端（compose / nginx）
    - "http://127.0.0.1:8080"
    - "http://127.0.0.1:5000"
